services:
  otel-collector:
    image: clickhouse/clickstack-otel-collector:latest
    container_name: liv-otel-collector
    restart: unless-stopped
    environment:
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [liv]

  api:
    build: ./api
    container_name: liv-api
    restart: unless-stopped
    environment:
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      API_PORT: ${API_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
    ports:
      - "8080:8080"
    depends_on: [otel-collector]
    networks: [liv]

  web:
    build: ./web
    container_name: liv-web
    restart: unless-stopped
    environment:
      VITE_API_BASE: /api
    ports:
      - "5173:5173"
    depends_on: [api]
    networks: [liv]

networks:
  liv:
    driver: bridge
